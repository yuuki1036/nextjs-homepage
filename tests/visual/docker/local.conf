<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Playwright 公式イメージでは sans-serif:lang=ja が WenQuanYi Zen Hei（中国語の字形）に当たる。
  イメージに入っている IPA P ゴシックを優先させ、日本語の字形で描かせる。
  手元は run.sh が /etc/fonts/local.conf にマウントし、CI はコピーする。
-->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>IPAPGothic</family>
    </prefer>
  </alias>
</fontconfig>
