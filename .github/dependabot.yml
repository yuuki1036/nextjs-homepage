version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    groups:
      patch:
        patterns:
          - "*"
        # 版が CI の visual ジョブのイメージと基準画像に結び付いているので、単独の PR にする
        exclude-patterns:
          - "@playwright/test"
        update-types:
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      patch:
        patterns:
          - "*"
        update-types:
          - "patch"
