version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    groups:
      patch:
        patterns:
          - "*"
        # 版が CI の visual ジョブのイメージと基準画像に結び付いているので、単独の PR にする
        exclude-patterns:
          - "@playwright/test"
        update-types:
          - "patch"
    ignore:
      # TypeScript 7 には手で上げ、そのときにプレビュー版の tsgo も外す
      - dependency-name: "@typescript/native-preview"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # 実行環境の Node（engines の 24.x）に合わせて手で上げる
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      # composite action は "/" の対象に入らない
      - "/.github/actions/setup-node"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      patch:
        patterns:
          - "*"
        update-types:
          - "patch"
