name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

  # 単体テスト（Vitest）。tests/visual/ のスクリーンショット比較は visual ジョブ
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Unit test
        run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Build
        run: npm run build

  # container.image はジョブの前に決まる必要があるので、版を先に読んで渡す
  playwright-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - name: Read @playwright/test version
        id: read
        run: |
          version="$(jq -r '.devDependencies["@playwright/test"]' package.json)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "@playwright/test は ^ なしの x.y.z で固定する（今: $version）" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # スクリーンショット比較とコンソール検査。基準画像を作った手元（Apple Silicon）と CPU を揃える
  visual:
    needs: playwright-version
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --init --ipc=host
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prefer IPAPGothic for Japanese
        run: |
          cp tests/visual/docker/local.conf /etc/fonts/local.conf
          fc-cache -f
          fc-match "sans-serif:lang=ja" | grep IPAPGothic

      # setup-node の composite は使わない（イメージに Node が入っており、
      # composite の node_modules のキャッシュキーには CPU が入っていない）
      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Visual test
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-results
          path: test-results/results.json
          if-no-files-found: ignore
          retention-days: 14

  # visual の結果を PR のコメント 1 件にまとめて書き直す（落ちたら変わった画像と画素数、通ったらそのこと）。
  # 書き込みの権限は、PR のコードを動かさない（npm ci しない）このジョブにだけ渡す
  visual-summary:
    needs: visual
    if: >-
      always() &&
      (needs.visual.result == 'failure' || needs.visual.result == 'success') &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            package.json
            scripts/visual-summary.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # node の組み込みだけで動かす（型は Node 24 がそのまま剥がす）
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          # package-lock.json を取り出していないので、packageManager からの自動キャッシュを止める
          package-manager-cache: false

      - name: Download results
        if: needs.visual.result == 'failure'
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: visual-results
          path: visual-results

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ needs.visual.result }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REFRESH_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/visual-refresh.yml
        run: |
          export PR_NUMBER="$EVENT_PR" HEAD_SHA="$EVENT_HEAD_SHA"

          comment_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- visual-summary -->")))] | .[0].id // empty' | head -n 1)"
          if [[ "$OUTCOME" == "success" && -z "$comment_id" ]]; then
            echo "落ちたことが無い PR なので、コメントしない"
            exit 0
          fi

          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON \
            scripts/visual-summary.ts visual-results/results.json "$OUTCOME" > body.md
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body=@body.md > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@body.md > /dev/null
          fi
          cat body.md >> "$GITHUB_STEP_SUMMARY"
